
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GrooveLab AI Player</title>
  <style>
    body { font: 16px system-ui; max-width: 720px; margin: 40px auto; padding: 16px; }
    button, input { margin: 10px 0; }
    pre { padding: 20px; background: #eee; overflow: auto; }
  </style>
</head>
<body>
  <h1>GrooveLab AI</h1>
  <p>Select a generated Groove JSON file.</p>
  <input id="file" type="file" accept=".json">
  <button id="play" disabled>Play groove</button>
  <pre id="grid">No groove loaded.</pre>

  <script>
    let score;

    document.querySelector("#file").addEventListener("change", async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      try {
        score = JSON.parse(await file.text());

        if (score.meter !== "4/4" || score.ticks_per_quarter !== 96) {
          throw new Error("This demo player supports 4/4 and 96 ticks per quarter.");
        }

        const steps = score.bars * 8;
        const lines = [`${score.style} — ${score.tempo.bpm} BPM`];

        lines.push("       " + Array.from(
          { length: steps },
          (_, i) => i % 2 === 0 ? (Math.floor(i / 2) % 4 + 1) : "&"
        ).join(" "));

        for (const [label, instrument] of [
          ["Hat  ", "closed_hat"],
          ["Snare", "snare"],
          ["Kick ", "kick"]
        ]) {
          const hits = new Set(
            score.events
              .filter(e => e.instrument === instrument)
              .map(e => e.tick)
          );

          lines.push(label + "  " + Array.from(
            { length: steps },
            (_, i) => hits.has(i * 48) ? "X" : "."
          ).join(" "));
        }

        document.querySelector("#grid").textContent = lines.join("\n");
        document.querySelector("#play").disabled = false;
      } catch (error) {
        score = null;
        document.querySelector("#grid").textContent = error.message;
        document.querySelector("#play").disabled = true;
      }
    });

    document.querySelector("#play").addEventListener("click", async () => {
      if (!score) return;

      const audio = new AudioContext();
      await audio.resume();

      const start = audio.currentTime + 0.1;
      const secondsPerTick = 60 / score.tempo.bpm / 96;

      for (const event of score.events) {
        const time = start + event.tick * secondsPerTick;
        playDrum(audio, event.instrument, time, event.velocity);
      }
    });

    function playDrum(ctx, instrument, time, velocity) {
      const volume = velocity / 127;
      const gain = ctx.createGain();
      gain.connect(ctx.destination);

      if (instrument === "kick") {
        const osc = ctx.createOscillator();
        osc.type = "sine";
        osc.frequency.setValueAtTime(150, time);
        osc.frequency.exponentialRampToValueAtTime(45, time + 0.15);

        gain.gain.setValueAtTime(0.6 * volume, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.22);

        osc.connect(gain);
        osc.start(time);
        osc.stop(time + 0.23);
        return;
      }

      const isSnare = instrument === "snare";
      const duration = isSnare ? 0.15 : 0.065;

      const buffer = ctx.createBuffer(
        1, Math.floor(ctx.sampleRate * duration), ctx.sampleRate
      );
      const samples = buffer.getChannelData(0);

      for (let i = 0; i < samples.length; i++) {
        samples[i] = Math.random() * 2 - 1;
      }

      const noise = ctx.createBufferSource();
      noise.buffer = buffer;

      const filter = ctx.createBiquadFilter();
      filter.type = isSnare ? "bandpass" : "highpass";
      filter.frequency.value = isSnare ? 1600 : 7000;

      gain.gain.setValueAtTime(
        (isSnare ? 0.5 : 0.25) * volume, time
      );
      gain.gain.exponentialRampToValueAtTime(0.001, time + duration);

      noise.connect(filter);
      filter.connect(gain);
      noise.start(time);
    }
  </script>
</body>
</html>
